services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port: the app reaches Redis through the compose network.
    # This avoids colliding with a host Redis on 6379.

  app:
    build: .
    image: wzry-rag:test
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RETRIEVER: hybrid
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
    depends_on:
      - redis
