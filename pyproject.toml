[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wzry-rag"
version = "0.2.0"
description = "Evaluation-driven RAG + MCP knowledge service for Honor of Kings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wzry-rag contributors" }]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "fastapi>=0.159.1",
    "jieba>=0.42.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.0",
    "lxml>=6.1.3",
    "mcp<2",
    "openai>=3.29.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.0",
    "ragas>=0.3.1",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/your-name/wzry-rag"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "retrieval*", "memory*", "mcp_server*", "ingest*", "eval*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
